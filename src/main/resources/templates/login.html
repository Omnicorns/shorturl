<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SURL</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #FAFAF9;
            --surface: #FFFFFF;
            --surface-soft: #F5F5F4;
            --border: #E7E5E4;
            --border-strong: #D6D3D1;
            --text: #1C1917;
            --text-muted: #78716C;
            --text-subtle: #A8A29E;
            --primary: #0F172A;
            --primary-hover: #1E293B;
            --accent: #4F46E5;
            --success-bg: #ECFDF5;
            --success-border: #A7F3D0;
            --success-text: #065F46;
            --error-bg: #FEF2F2;
            --error-border: #FECACA;
            --error-text: #991B1B;
            --warning-bg: #FFFBEB;
            --warning-border: #FDE68A;
            --warning-text: #92400E;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 16% 18%, rgba(79, 70, 229, 0.08) 0%, transparent 34%),
                radial-gradient(circle at 86% 82%, rgba(15, 23, 42, 0.06) 0%, transparent 36%);
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .auth-shell {
            width: 100%;
            max-width: 880px;
            height: min(760px, calc(100svh - 32px));
            max-height: calc(100svh - 32px);
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 420px;
            background: rgba(255,255,255,.78);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.04),
                0 18px 50px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(12px);
        }

        .hero-panel {
            padding: 42px;
            background:
                linear-gradient(145deg, rgba(15, 23, 42, .96), rgba(30, 41, 59, .94)),
                radial-gradient(circle at top left, rgba(99,102,241,.5), transparent 42%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .hero-panel::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 999px;
            right: -130px;
            bottom: -130px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.08);
        }

        .hero-logo-line {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .hero-logo {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(255,255,255,.96);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.2);
            box-shadow: 0 12px 28px rgba(0,0,0,.18);
            overflow: hidden;
        }

        .hero-logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            display: block;
        }

        .hero-kicker {
            font-size: 12px;
            color: rgba(255,255,255,.72);
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .hero-brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 330px;
        }

        .hero-copy h2 {
            font-size: 32px;
            line-height: 1.08;
            letter-spacing: -.04em;
            margin-bottom: 14px;
        }

        .hero-copy p {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(255,255,255,.75);
        }

        .auth-panel {
            background: var(--surface);
            padding: 26px 34px 18px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }

        .mobile-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0,0,0,.06);
            overflow: hidden;
        }

        .mobile-logo img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            display: block;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .auth-tab {
            border: 0;
            background: transparent;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: .15s ease;
        }

        .auth-tab:hover { color: var(--text); }

        .auth-tab.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 3px rgba(15,23,42,.08);
        }

        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn .18s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: none; }
        }

        h1 {
            text-align: center;
            color: var(--text);
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-size: 14px;
        }

        .field { margin-bottom: 10px; }

        #registerFormPanel .field { margin-bottom: 8px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-wrap { position: relative; }

        input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        #registerFormPanel input {
            padding-top: 8px;
            padding-bottom: 8px;
        }

        input::placeholder { color: var(--text-subtle); }
        input:hover { border-color: #A8A29E; }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .input-wrap input[type="password"],
        .input-wrap input.has-toggle {
            padding-right: 42px;
        }

        .toggle-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 6px;
            margin: 0;
            width: auto;
            cursor: pointer;
            color: var(--text-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .toggle-btn:hover {
            color: var(--text);
            background: var(--surface-soft);
        }

        .toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 4px 0 12px;
            font-size: 13px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
        }

        .link-btn {
            border: 0;
            background: transparent;
            padding: 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }

        .link-btn:hover { text-decoration: underline; }

        button[type="submit"],
        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 8px;
            transition: background 0.15s ease, transform 0.05s ease, box-shadow .15s ease;
            box-shadow: 0 8px 18px rgba(15,23,42,.14);
        }

        button[type="submit"]:hover,
        .submit-btn:hover {
            background: var(--primary-hover);
        }

        button[type="submit"]:active,
        .submit-btn:active {
            transform: scale(0.99);
        }

        .alert {
            border: 1px solid;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.45;
        }

        .alert svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .alert-error {
            background: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-border);
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-border);
        }

        .alert-warning {
            background: var(--warning-bg);
            color: var(--warning-text);
            border-color: var(--warning-border);
        }

        .switch-copy {
            margin-top: 11px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-copy button { margin-left: 4px; }

        .back {
            text-align: center;
            margin-top: 13px;
            padding-top: 13px;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }

        .back a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .back a:hover { color: var(--text); }

        .password-help {
            margin-top: 5px;
            color: var(--text-subtle);
            font-size: 11px;
            line-height: 1.35;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, .54);
            backdrop-filter: blur(6px);
            z-index: 1000;
        }

        .modal-backdrop.show {
            display: flex;
            animation: fadeIn .15s ease;
        }

        .modal-card {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, .24);
            overflow: hidden;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            padding: 22px 22px 14px;
            border-bottom: 1px solid var(--border);
        }

        .modal-head h3 {
            font-size: 20px;
            letter-spacing: -.03em;
            margin-bottom: 4px;
        }

        .modal-head p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
            display: grid;
            place-items: center;
        }

        .modal-close:hover {
            color: var(--text);
            background: var(--surface-soft);
        }

        .modal-body {
            padding: 18px 22px 22px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .modal-actions .secondary-btn,
        .modal-actions button[type="submit"],
        .modal-actions .submit-btn {
            margin-top: 0;
        }

        .secondary-btn {
            width: 100%;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s ease;
        }

        .secondary-btn:hover { background: var(--surface-soft); }

        .copy-hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @media (max-height: 720px) and (min-width: 821px) {
            body {
                padding: 8px;
            }

            .auth-shell {
                height: calc(100svh - 16px);
                max-height: calc(100svh - 16px);
            }

            .auth-panel {
                padding: 18px 28px 12px;
            }

            .auth-tabs {
                margin-bottom: 10px;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                margin-bottom: 9px;
                font-size: 13px;
            }

            #registerFormPanel .field {
                margin-bottom: 5px;
            }

            input {
                padding: 7px 10px;
                font-size: 13px;
            }

            .password-help {
                display: none;
            }

            .back {
                margin-top: 8px;
                padding-top: 8px;
            }
        }

        @media (max-width: 820px) {
            html,
            body {
                overflow: auto;
            }

            body {
                padding: 16px;
                align-items: flex-start;
            }

            .auth-shell {
                grid-template-columns: 1fr;
                max-width: 430px;
                height: auto;
                max-height: none;
                min-height: auto;
            }

            .hero-panel { display: none; }

            .auth-panel {
                padding: 32px 24px 24px;
                overflow: visible;
            }

            .mobile-logo { display: flex; }
        }

        @media (max-width: 420px) {
            body { padding: 12px; }

            .auth-panel {
                padding: 26px 18px 20px;
            }

            .auth-tabs { margin-bottom: 20px; }

            .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="auth-shell">
    <aside class="hero-panel">
        <div class="hero-logo-line">
            <div class="hero-logo" aria-label="Logo">
                <img th:src="@{/img.png}" src="/img.png" alt="Logo Admin">
            </div>
            <div>
                <div class="hero-kicker">SURL</div>
                <div class="hero-brand">SURL Dashboard</div>
            </div>
        </div>

        <div class="hero-copy">
            <h2>Masuk ke dashboard SURL.</h2>
            <p>Gunakan akun yang sudah dibuat dari dashboard User SURL.</p>
        </div>
    </aside>

    <main class="auth-panel">
        <div class="mobile-logo" aria-label="Logo">
            <img th:src="@{/img.png}" src="/img.png" alt="Logo Admin">
        </div>

        <!-- LOGIN FORM -->
        <section class="auth-form active" id="loginFormPanel" role="tabpanel" aria-labelledby="loginTab">
            <h1>Admin Login</h1>
            <p class="subtitle">Masuk untuk mengelola short URL</p>

            <div th:if="${param.error}" class="alert alert-error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>Username atau password salah.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5"></path>
                </svg>
                <span>Anda berhasil logout.</span>
            </div>

            <div th:if="${param.passwordChanged}" class="alert alert-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5"></path>
                </svg>
                <span>Password berhasil diganti. Silakan login.</span>
            </div>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username" placeholder="admin" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" class="has-toggle js-password"
                               placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-btn js-toggle-password" aria-label="Tampilkan password" data-target="password">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" name="remember-me">
                        <span>Ingat saya</span>
                    </label>
                </div>

                <button type="submit">Login</button>
            </form>
        </section>

        <p class="back"><a href="/">← Kembali ke Beranda</a></p>
    </main>
</div>

<script>
    (function () {
        const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        const eyeOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

        document.querySelectorAll('.js-toggle-password').forEach(function (toggleBtn) {
            toggleBtn.addEventListener('click', function () {
                const input = document.getElementById(toggleBtn.dataset.target);
                const icon = toggleBtn.querySelector('.eye-icon');
                if (!input || !icon) return;

                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.innerHTML = isPassword ? eyeOff : eyeOpen;
                toggleBtn.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
            });
        });
    })();
</script>
</body>
</html>
