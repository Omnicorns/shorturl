<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafaf9; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1c1917; }
        .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.05); }
        h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
        p { color: #78716c; font-size: 14px; text-align: center; margin-bottom: 22px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .field { margin-bottom: 14px; }
        input { width: 100%; border: 1px solid #d6d3d1; border-radius: 8px; padding: 11px 13px; font-size: 14px; }
        input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
        button { width: 100%; border: none; border-radius: 8px; padding: 12px; background: #0f172a; color: #fff; font-weight: 700; cursor: pointer; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .back { margin-top: 18px; text-align: center; }
        .back a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset Password</h1>
    <p>Masukkan password baru untuk akun Anda.</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="field">
            <label>Password Baru</label>
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
            <label>Konfirmasi Password</label>
            <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit">Simpan Password</button>
    </form>

    <div class="back"><a th:href="@{/login}">← Kembali ke Login</a></div>
</div>
</body>
</html>
