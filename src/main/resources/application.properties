spring.application.name=shorturl
server.port=8020

# === Kompresi HTTP (gzip) ===
# Memperkecil transfer aset besar seperti pdf.js & pdf.worker.js.
# pdf.worker.js ~1.9 MB bisa turun ke ~0.5 MB. application/pdf SENGAJA tidak
# dikompres agar range request (206) untuk viewer tetap bekerja.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/xml,font/woff2
server.compression.min-response-size=1024

# === Cache aset statis ===
# Setelah dimuat sekali, pdf.js/pdf.worker.js diambil dari cache browser
# (buka viewer berikutnya jadi instan). File pakai nama berversi/sama,
# jadi aman di-cache lama.
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true


spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# === Reverse Proxy / IP forwarding ===
#server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
#server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
#server.tomcat.remoteip.host-header=X-Forwarded-Host
#server.tomcat.remoteip.port-header=X-Forwarded-Port
#server.tomcat.remoteip.internal-proxies=.*




spring.thymeleaf.cache=false


# Akun emergency lokal. WAJIB di-set lewat environment variable, jangan di-commit.
# Kalau salah satu kosong, akun emergency DINONAKTIFKAN.
# APP_ADMIN_PASSWORD boleh berupa hash BCrypt ($2a$/$2b$/$2y$...).
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Daftar username (CSV) yang otomatis menjadi super-admin ?
# bisa melihat & mengelola SEMUA short URL, bukan hanya milik sendiri.
# User yang sama dengan app.admin.username sudah otomatis super-admin.
# Contoh: app.superadmins=budi,siti@sarinah.net
app.superadmins=


app.base-url=


app.log.geolocation-enabled=true

server.forward-headers-strategy=native


spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=110MB

sarinah.rssapp.feed-url=https://rss.app/feeds/v1.1/ag13Zgy3l09ricDp.json


ldap.url=${LDAP_URL:ldap://10.0.7.12:389}
ldap.domain=${LDAP_DOMAIN:sarinah.net}
ldap.base-dn=${LDAP_BASE_DN:DC=sarinah,DC=net}

# Service account untuk SEARCH user di AD.
# Wajib di-set kalau AD Anda menolak anonymous search (default Microsoft AD).
# Tanpa ini, fitur autocomplete user di "Kelola Akses" akan return kosong.
#
# Cara aman: set lewat environment variable, JANGAN commit password.
#   export LDAP_BIND_PASSWORD='xxx'
#   ldap.manager-password=${LDAP_BIND_PASSWORD:}
#
# Contoh DN:
#   ldap.manager-dn=CN=svc-portal,OU=Service Accounts,DC=sarinah,DC=net
ldap.manager-dn=${LDAP_BIND_DN:}
ldap.manager-password=${LDAP_BIND_PASSWORD:}

# Hanya anggota group AD berikut (CN group, CSV, case-insensitive) yang boleh login
# ke dashboard sebagai ROLE_ADMIN. Kosong = TIDAK ADA user AD yang boleh login.
# Contoh: LDAP_ADMIN_GROUPS=SURL-Admins,IT-Group
ldap.admin-groups=${LDAP_ADMIN_GROUPS:}
# Anggota group ini otomatis jadi super-admin (ROLE_SUPERADMIN).
ldap.superadmin-groups=${LDAP_SUPERADMIN_GROUPS:}

# Optional: batasi search ke OU tertentu untuk performance & precision.
# Default: pakai base-dn di atas (seluruh forest dari root).
# ldap.user-search-base=OU=Users,DC=sarinah,DC=net

# ldap.group-search-base=OU=Groups,DC=sarinah,DC=net
# ldap.group-search-filter=(&(objectClass=group)(member={0}))

# Naikkan ke DEBUG hanya sementara saat troubleshooting.
logging.level.org.springframework.security.ldap=INFO
logging.level.org.springframework.ldap=INFO
logging.level.com.app.shorturl.service.LdapUserSearchService=INFO
logging.level.org.springframework.security.web=INFO





springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

app.pdf.storage-dir=/var/app/pdf-storage

# Secret HMAC untuk token tracking (/api/v1/track-ip). Set ke string acak panjang.
# Kalau kosong, dibuat acak saat start (token lama tidak berlaku setelah restart).
app.tracking.secret=${APP_TRACKING_SECRET:}
# Batas waktu (detik) browser boleh meng-update data lokasi sebuah klik.
app.tracking.update-window-seconds=600

# Link lama /catalogue?id=N (tanpa kunci akses) - false = ditolak.
# Short URL yang mengarah ke /catalogue?id=N otomatis ditambah kunci saat startup.
app.pdf.allow-legacy-id-links=${APP_PDF_ALLOW_LEGACY_ID_LINKS:false}
