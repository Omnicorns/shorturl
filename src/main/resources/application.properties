#server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
#server.tomcat.remoteip.host-header=X-Forwarded-Host
#server.tomcat.remoteip.port-header=X-Forwarded-Port
#server.tomcat.remoteip.internal-proxies=.*




spring.thymeleaf.cache=false


app.admin.username=surl
app.admin.password=surl123

# Daftar username (CSV) yang otomatis menjadi super-admin —
# bisa melihat & mengelola SEMUA short URL, bukan hanya milik sendiri.
# User yang sama dengan app.admin.username sudah otomatis super-admin.
# Contoh: app.superadmins=budi,siti@sarinah.net
app.superadmins=


app.base-url=


app.log.geolocation-enabled=true

server.forward-headers-strategy=native


spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=110MB

sarinah.rssapp.feed-url=https://rss.app/feeds/v1.1/ag13Zgy3l09ricDp.json


ldap.url=ldap://10.0.7.12:389
ldap.domain=sarinah.net
ldap.base-dn=DC=sarinah,DC=net

# Service account untuk SEARCH user di AD.
# Wajib di-set kalau AD Anda menolak anonymous search (default Microsoft AD).
# Tanpa ini, fitur autocomplete user di "Kelola Akses" akan return kosong.
#
# Cara aman: set lewat environment variable, JANGAN commit password.
#   export LDAP_BIND_PASSWORD='xxx'
#   ldap.manager-password=${LDAP_BIND_PASSWORD:}
#
# Contoh DN:
#   ldap.manager-dn=CN=svc-portal,OU=Service Accounts,DC=sarinah,DC=net
ldap.manager-dn=itgroup@sarinah.net
ldap.manager-password=Diganti123!@#

# Optional: batasi search ke OU tertentu untuk performance & precision.
# Default: pakai base-dn di atas (seluruh forest dari root).
# ldap.user-search-base=OU=Users,DC=sarinah,DC=net

# ldap.group-search-base=OU=Groups,DC=sarinah,DC=net
# ldap.group-search-filter=(&(objectClass=group)(member={0}))

logging.level.org.springframework.security.ldap=DEBUG
logging.level.org.springframework.ldap=DEBUG
logging.level.com.app.shorturl.service.LdapUserSearchService=DEBUG
logging.level.org.springframework.security.ldap.authentication.ad=DEBUG
logging.level.org.springframework.security.web.csrf=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG





springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true